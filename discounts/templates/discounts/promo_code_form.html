<form id="promo-code-form"
      method="post"
      action="{% url 'discounts:apply_promo_code' %}">
    {% csrf_token %}
    <input type="hidden" name="order_amount" value="{{ order_total }}">
    <div class="promo-input-row">
        <label class="sr-only" for="promo-code-input">Promo code</label><input id="promo-code-input"
                                                                               type="text"
                                                                               name="promo_code"
                                                                               value="{{ request.session.promo_code|default_if_none:'' }}"
                                                                               placeholder="WELCOME10"
                                                                               autocomplete="off"><button type="submit">Apply</button>
    </div>
</form>
{% if request.session.promo_code %}<form method="post" action="{% url 'discounts:remove_promo_code' %}">{% csrf_token %}<button class="promo-remove-button" type="submit">Remove applied code</button></form>{% endif %}
<div id="promo-code-message"
     class="promo-message"
     role="status"
     aria-live="polite"></div>
<script>document.addEventListener('DOMContentLoaded',function(){const form=document.getElementById('promo-code-form');if(!form)return;form.addEventListener('submit',async function(event){event.preventDefault();const message=document.getElementById('promo-code-message');try{const response=await fetch(form.action,{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest'},body:new FormData(form)});const data=await response.json();message.textContent=data.success?'Code applied — save '+data.discount+' on this demo order.':(data.message||'This code could not be applied.');message.style.color=data.success?'#285c52':'#a3483d';if(data.success)window.location.reload()}catch(error){message.textContent='Could not connect. Please try again.';message.style.color='#a3483d'}})});</script>
