<nav class="sort-buttons" aria-label="Sort products">
    {% with s=current_sort %}
        <a class="sort-btn {% if s == 'new' %}active{% endif %}"
           href="?sort=new{% if request.GET.q %}&amp;q={{ request.GET.q|urlencode }}{% endif %}">Newest</a>
        <a class="sort-btn {% if s == 'popular' %}active{% endif %}"
           href="?sort=popular{% if request.GET.q %}&amp;q={{ request.GET.q|urlencode }}{% endif %}">Popular</a>
        <a class="sort-btn {% if s == 'price_low' %}active{% endif %}"
           href="?sort=price_low{% if request.GET.q %}&amp;q={{ request.GET.q|urlencode }}{% endif %}">Price: low to high</a>
        <a class="sort-btn {% if s == 'price_high' %}active{% endif %}"
           href="?sort=price_high{% if request.GET.q %}&amp;q={{ request.GET.q|urlencode }}{% endif %}">Price: high to low</a>
    {% endwith %}
</nav>
