{% if products.paginator.num_pages > 1 %}
    <nav class="pagination" aria-label="Pagination">
        {% if products.has_previous %}<a class="page-link"
                                         rel="prev"
                                         aria-label="Previous page"
                                         href="?page={{ products.previous_page_number }}{% if request.GET.sort %}&amp;sort={{ request.GET.sort }}{% endif %}{% if request.GET.q %}&amp;q={{ request.GET.q|urlencode }}{% endif %}">←</a>{% endif %}
        <span class="page-status">Page {{ products.number }} of {{ products.paginator.num_pages }}</span>
        {% if products.has_next %}<a class="page-link"
                                     rel="next"
                                     aria-label="Next page"
                                     href="?page={{ products.next_page_number }}{% if request.GET.sort %}&amp;sort={{ request.GET.sort }}{% endif %}{% if request.GET.q %}&amp;q={{ request.GET.q|urlencode }}{% endif %}">→</a>{% endif %}
    </nav>
{% endif %}
