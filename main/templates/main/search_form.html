<form method="get" class="search-form" role="search">
    <label class="sr-only"
           for="catalog-search">Search products</label><span class="search-icon"
                                                             aria-hidden="true">⌕</span>
    <input id="catalog-search"
           type="search"
           name="q"
           placeholder="Search the collection"
           value="{{ request.GET.q|default:'' }}">
    {% if request.GET.sort %}<input type="hidden"
                                    name="sort"
                                    value="{{ request.GET.sort }}">{% endif %}<button class="button button-dark" type="submit">Search</button>
</form>
